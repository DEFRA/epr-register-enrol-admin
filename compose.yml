services:
  redis:
    image: redis:7.2.3-alpine3.18
    networks:
      - cdp-tenant

  epr-register-enrol-admin:
    build: ./
    ports:
      # Host port: set ADMIN_PORT if 3000 is taken
      - '${ADMIN_PORT:-3000}:3000'
    depends_on:
      redis:
        condition: service_started
    environment:
      PORT: 3000
      NODE_ENV: production
      REDIS_HOST: redis
      LOG_FORMAT: pino-pretty
      SESSION_COOKIE_SECURE: false
      USE_SINGLE_INSTANCE_CACHE: true
      REDIS_TLS: false
    networks:
      - cdp-tenant

networks:
  cdp-tenant:
    driver: bridge
