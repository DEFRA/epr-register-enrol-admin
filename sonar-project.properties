# SonarCloud setup: https://github.com/DEFRA/cdp-documentation/blob/main/how-to/sonarcloud.md

sonar.projectKey=DEFRA_epr-register-enrol-admin
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/epr-register-enrol-admin
sonar.links.ci=https://github.com/DEFRA/epr-register-enrol-admin/actions
sonar.links.scm=https://github.com/DEFRA/epr-register-enrol-admin
sonar.links.issue=https://github.com/DEFRA/epr-register-enrol-admin/issues

sonar.sources=src/
sonar.exclusions=src/**/*.test.js
sonar.tests=src/
sonar.test.inclusions=src/**/*.test.js

sonar.javascript.lcov.reportPaths=./coverage/lcov.info

sonar.cpd.exclusions=src/**/*.test.js
